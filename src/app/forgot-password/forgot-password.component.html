<section class="auth-card">
  <div class="municipal-brand">
    <div class="municipal-seal" aria-hidden="true">M</div>
    <div>
      <strong>Palestine Civic Services</strong>
      <span>Account recovery</span>
    </div>
  </div>

  <h1>Reset password</h1>

  @if (sent()) {
    <p class="form-success">
      If an account exists for that email, a reset link is on its way. Check your inbox.
    </p>
    <p class="meta"><a routerLink="/login">Back to login</a></p>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (serverError()) {
        <p class="form-error">{{ serverError() }}</p>
      }

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="field-error">Enter a valid email.</p>
        }
      </label>

      <button type="submit" class="primary-btn" [disabled]="submitting()">
        {{ submitting() ? 'Sending...' : 'Send reset link' }}
      </button>
    </form>

    <p class="meta"><a routerLink="/login">Back to login</a></p>
  }
</section>
