<section class="auth-card">
  <div class="municipal-brand">
    <div class="municipal-seal" aria-hidden="true">M</div>
    <div>
      <strong>Palestine Civic Services</strong>
      <span>Citizen access</span>
    </div>
  </div>

  <h1>Login</h1>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (serverError()) {
      <p class="form-error">{{ serverError() }}</p>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="field-error">Enter a valid email.</p>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="field-error">Password must be at least 8 characters.</p>
      }
    </label>

    <div class="row">
      <button type="submit" class="primary-btn" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Login' }}
      </button>
      <a routerLink="/forgot-password">Forgot password?</a>
    </div>
  </form>

  <button type="button" class="public-report" (click)="openReportProblem()">
    <div>
      <strong>Need to report an issue?</strong>
      <span>Submit a problem without creating an account.</span>
    </div>
    <span class="report-link">Report a problem</span>
  </button>

  <p class="meta">No account? <a routerLink="/register">Create one</a></p>
</section>
