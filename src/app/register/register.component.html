<section class="auth-card">
  <div class="municipal-brand">
    <div class="municipal-seal" aria-hidden="true">M</div>
    <div>
      <strong>Palestine Civic Services</strong>
      <span>Resident registration</span>
    </div>
  </div>

  <h1>Create account</h1>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (serverError()) {
      <p class="form-error">{{ serverError() }}</p>
    }

    <label class="field">
      <span>Display name</span>
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <p class="field-error">Enter a display name (at least 2 characters).</p>
      }
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="field-error">Enter a valid email.</p>
      }
    </label>

    <label class="field">
      <span>Phone <em>(optional)</em></span>
      <input type="tel" formControlName="phone" autocomplete="tel" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="field-error">Password must be at least 8 characters and include upper/lowercase, a number and a symbol.</p>
      }
    </label>

    <label class="field">
      <span>Confirm password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (
        form.controls.confirmPassword.touched &&
        (form.controls.confirmPassword.invalid || form.hasError('passwordsMismatch'))
      ) {
        <p class="field-error">
          {{ form.hasError('passwordsMismatch') ? 'Passwords do not match.' : 'Password must be at least 8 characters.' }}
        </p>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Creating account...' : 'Register' }}
    </button>
  </form>

  <p class="meta">Already have an account? <a routerLink="/login">Login</a></p>
</section>
