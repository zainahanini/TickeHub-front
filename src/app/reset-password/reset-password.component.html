<section class="auth-card">
  <div class="municipal-brand">
    <div class="municipal-seal" aria-hidden="true">M</div>
    <div>
      <strong>Municipality Services Portal</strong>
      <span>Secure password update</span>
    </div>
  </div>

  <h1>Set a new password</h1>

  @if (done()) {
    <p class="form-success">Your password has been updated. You can sign in with it now.</p>
    <p class="meta"><a routerLink="/login">Back to login</a></p>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (serverError()) {
        <p class="form-error">{{ serverError() }}</p>
      }

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="field-error">Enter the email for this account.</p>
        }
      </label>

      <label class="field">
        <span>New password</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="field-error">Password must be at least 8 characters.</p>
        }
      </label>

      <label class="field">
        <span>Confirm password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.controls.confirmPassword.touched && (form.controls.confirmPassword.invalid || form.hasError('passwordsMismatch'))) {
          <p class="field-error">
            {{ form.hasError('passwordsMismatch') ? 'Passwords do not match.' : 'Password must be at least 8 characters.' }}
          </p>
        }
      </label>

      <button type="submit" class="primary-btn" [disabled]="submitting()">
        {{ submitting() ? 'Updating...' : 'Update password' }}
      </button>
    </form>

    <p class="meta"><a routerLink="/forgot-password">Request a new link</a></p>
  }
</section>
