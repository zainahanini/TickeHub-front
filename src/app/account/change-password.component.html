<section class="panel">
  <h1>Change password</h1>
  <p class="lede">This keeps you signed in here and signs out your other sessions.</p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (serverError()) {
      <p class="form-error">{{ serverError() }}</p>
    }
    @if (success()) {
      <p class="form-success">Password updated. Other devices have been signed out.</p>
    }

    <label class="field">
      <span>Current password</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
      @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
        <p class="field-error">Enter your current password.</p>
      }
    </label>

    <label class="field">
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <p class="field-error">Password must be at least 8 characters.</p>
      }
    </label>

    <label class="field">
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && (form.controls.confirmPassword.invalid || form.hasError('passwordsMismatch'))) {
        <p class="field-error">
          {{ form.hasError('passwordsMismatch') ? 'Passwords do not match.' : 'Password must be at least 8 characters.' }}
        </p>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Update password' }}
    </button>
  </form>
</section>
