<div class="shell">
  <header class="topbar">
    <div class="brand">
      <strong>Palestine Civic Services</strong>
      @if (user(); as current) {
        <span>{{ current.displayName }}</span>
      }
    </div>
    <nav>
      <a routerLink="/report-problem" routerLinkActive="active">Report a problem</a>
      <a routerLink="/sessions" routerLinkActive="active">My sessions</a>
      <a routerLink="/change-password" routerLinkActive="active">Change password</a>
      <button type="button" class="text-btn" (click)="logout()">Log out</button>
    </nav>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
